name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install V 0.5.2
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/v_linux.zip" https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip
          unzip -q "$RUNNER_TEMP/v_linux.zip" -d "$RUNNER_TEMP/v-toolchain"
          "$RUNNER_TEMP/v-toolchain/v/v" version
          echo "$RUNNER_TEMP/v-toolchain/v" >> "$GITHUB_PATH"
      - name: Unit and shell integration tests
        run: make test
      - name: Deterministic parser stress test
        run: make fuzz FUZZ_ITER=10000 FUZZ_SEED=32423425234234
      - name: Build shell
        run: make build
